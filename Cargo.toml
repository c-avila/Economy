[package]
name = "dax_economia_desktop"
version = "0.3.0"
edition = "2021"
authors = ["Clayton J C P Avila"]
description = "DAX - Data Analysis Exchange (v0.3) — Plataforma Desktop Windows 11 & macOS para Análise de Ações, Câmbio (DXY), Juros Globais e Indicadores Macroeconômicos"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
egui_plot = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
open = "5.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
